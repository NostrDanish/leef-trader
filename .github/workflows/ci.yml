name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**", "upgrade/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel stale runs on the same ref so only the latest push is built.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Independent checks run as parallel jobs so wall-clock time is the slowest
  # check rather than the sum of all of them.
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint, test, build]
    env:
      # The CI build is never deployed; don't hit the Alcor API for the seed.
      SKIP_SEED_SNAPSHOT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Restore tsc / eslint caches
        if: matrix.task == 'typecheck' || matrix.task == 'lint'
        uses: actions/cache@v4
        with:
          path: |
            .tsbuildinfo
            .eslintcache
          key: ${{ matrix.task }}-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'eslint.config.js') }}-${{ github.sha }}
          restore-keys: |
            ${{ matrix.task }}-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'eslint.config.js') }}-

      - if: matrix.task == 'typecheck'
        run: npm run typecheck

      # Content strategy: checkout resets mtimes, so the default metadata
      # strategy would invalidate the whole restored cache.
      - if: matrix.task == 'lint'
        run: npx eslint --cache --cache-strategy content --max-warnings 0

      - if: matrix.task == 'test'
        run: npx vitest run

      - if: matrix.task == 'build'
        run: npm run build
