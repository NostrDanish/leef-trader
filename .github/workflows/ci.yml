name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**", "upgrade/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel stale runs on the same ref so only the latest push is built.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # TODO: `npm run lint` still reports 31 pre-existing errors in
      # src/components/terminal + index.html — pay down that debt and restore
      # the full-repo lint here.
      - name: lint (core libs)
        run: npx eslint src/lib src/store src/hooks --max-warnings 0

      - run: npx vitest run

      - run: npm run build
